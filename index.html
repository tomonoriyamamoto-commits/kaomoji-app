<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4万件！顔文字検索アプリ</title>
<style>
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    text-align: center;
    background-color: #f0f8ff;
    color: #333;
    padding: 20px;
  }
  h1 { font-size: 24px; color: #555; }
  
  #searchInput {
    padding: 12px;
    width: 90%;
    max-width: 400px;
    font-size: 16px;
    border-radius: 25px;
    border: 2px solid #ccc;
    outline: none;
    transition: 0.3s;
  }
  #searchInput:focus { border-color: #87cefa; }

  #loading {
    margin-top: 20px;
    font-weight: bold;
    color: #0066cc;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .kaomoji-card {
    background: white;
    padding: 15px 25px;
    border-radius: 15px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    font-size: 20px;
    transition: 0.2s;
  }
  .kaomoji-card:hover {
    transform: scale(1.1);
    background-color: #e6e6fa;
  }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    display: none;
    z-index: 1000;
  }
</style>
</head>
<body>

  <h1>( ᐛ ) 4万件！顔文字検索アプリ ( ᐖ )</h1>
  <p>今の気分を入力してね（例：怖い、嬉しい、猫 など）</p>
  
  <input type="text" id="searchInput" placeholder="感情や言葉を入力..." onkeyup="searchKaomoji()">

  <div id="loading">📦 41,000件の顔文字データを読み込み中...</div>
  <div class="container" id="results"></div>
  <div id="toast">コピーしました！</div>

  <script>
    let allKaomojiData = []; // 読み込んだ全てのデータを保存する箱

    // ▼ 日本語を英語カテゴリーに変換する「翻訳辞書」 ▼
    const jpToEnDictionary = {
      "怖い": ["fear", "scared"],
      "こわい": ["fear", "scared"],
      "嬉しい": ["happy", "joy", "smile"],
      "うれしい": ["happy", "joy"],
      "笑う": ["smile", "laugh"],
      "悲しい": ["cry", "sad"],
      "泣く": ["cry"],
      "怒る": ["angry", "mad"],
      "挨拶": ["hello", "greet"],
      "おはよう": ["hello", "morning"],
      "おやすみ": ["sleep", "goodnight"],
      "寝る": ["sleep"],
      "好き": ["love", "hug"],
      "愛": ["love"],
      "可愛い": ["cute", "kawaii"],
      "かわいい": ["cute"],
      "驚く": ["surprise", "shock"],
      "びっくり": ["surprise"],
      "猫": ["cat"],
      "ねこ": ["cat"],
      "犬": ["dog"],
      "いぬ": ["dog"],
      "動物": ["bear", "bird", "cat", "dog", "pig", "rabbit"],
      "武器": ["gun", "sword", "weapon"],
      "音楽": ["music", "sing", "dance"]
    };

    // オープンデータをインターネットから直接読み込む機能
    async function loadData() {
      try {
        // kaomoji-collectionの最新データを取得
        const response = await fetch('https://cdn.jsdelivr.net/npm/kaomoji-collection/kaomoji.json');
        const json = await response.json();
        
        // データをアプリで使いやすい形に整理する
        for (const [category, faces] of Object.entries(json)) {
          faces.forEach(face => {
            allKaomojiData.push({ face: face, category: category });
          });
        }
        
        // 読み込み完了したらメッセージを消し、最初の100件を表示
        document.getElementById('loading').style.display = 'none';
        displayKaomoji(allKaomojiData.slice(0, 100)); // 多すぎると画面が固まるので最初は100件

      } catch (error) {
        document.getElementById('loading').innerText = "データの読み込みに失敗しました(T_T)";
      }
    }

    // 画面に顔文字を表示する機能
    function displayKaomoji(dataArray) {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = ''; 

      if (dataArray.length === 0) {
        resultsContainer.innerHTML = '<p>見つかりませんでした( ；∀；)<br>別の言葉で試してみてね。</p>';
        return;
      }

      // 最大200件まで表示（スマホの動作を軽くするため）
      const limit = Math.min(dataArray.length, 200);
      for(let i = 0; i < limit; i++) {
        const item = dataArray[i];
        const card = document.createElement('div');
        card.className = 'kaomoji-card';
        card.innerText = item.face;
        card.onclick = () => copyToClipboard(item.face);
        resultsContainer.appendChild(card);
      }
    }

    // 検索機能
    function searchKaomoji() {
      const keyword = document.getElementById('searchInput').value.trim();
      
      if (keyword === "") {
        displayKaomoji(allKaomojiData.slice(0, 100)); // 空欄なら最初の100件
        return;
      }

      // 日本語のキーワードを英語のカテゴリー名に変換する
      let targetCategories = [];
      if (jpToEnDictionary[keyword]) {
        targetCategories = jpToEnDictionary[keyword]; // 辞書にあれば変換
      } else {
        targetCategories = [keyword.toLowerCase()]; // 辞書になければそのまま（英語で検索された用）
      }

      // 該当する顔文字を探す
      const filteredData = allKaomojiData.filter(item => {
        return targetCategories.includes(item.category);
      });

      displayKaomoji(filteredData);
    }

    // コピー機能
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 1500);
      });
    }

    // アプリを開いた時にデータを読み込む
    window.onload = loadData;

  </script>
</body>
</html>
